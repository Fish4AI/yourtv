<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fish TV 远程配置</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #081115;
            --surface: rgba(10, 25, 31, 0.86);
            --line: rgba(255, 255, 255, 0.14);
            --line-strong: rgba(255, 255, 255, 0.22);
            --text: #f4fbff;
            --muted: #a9bec7;
            --accent: #15d0c3;
            --accent-strong: #5ff3df;
            --field: #f7fbfc;
            --field-text: #102027;
            --danger: #ff8a65;
            --ok: #90e6a7;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 26px clamp(14px, 4vw, 48px) 42px;
            background:
                radial-gradient(circle at 18% 0%, rgba(21, 208, 195, 0.18), transparent 30rem),
                linear-gradient(145deg, #081115 0%, #10242b 52%, #061013 100%);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        a {
            color: var(--accent-strong);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .page {
            max-width: 1160px;
            margin: 0 auto;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        .brand-logo {
            width: 62px;
            height: 62px;
            border-radius: 16px;
            box-shadow: 0 0 28px rgba(21, 208, 195, 0.26);
        }

        .brand-title {
            margin: 0;
            font-size: clamp(2rem, 5vw, 3rem);
            line-height: 1;
            letter-spacing: 0;
        }

        .brand-subtitle {
            margin: 8px 0 0;
            color: var(--muted);
            font-size: 1rem;
        }

        .section {
            padding: 20px 0;
            border-top: 1px solid var(--line);
        }

        .section:last-of-type {
            border-bottom: 1px solid var(--line);
        }

        .section-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        h2 {
            margin: 0;
            font-size: 1.18rem;
            letter-spacing: 0;
        }

        .hint {
            margin: 8px 0 0;
            color: var(--muted);
            line-height: 1.6;
            font-size: 0.94rem;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: var(--text);
            font-weight: 700;
        }

        .field-row {
            display: flex;
            gap: 10px;
            align-items: stretch;
        }

        input,
        textarea,
        button {
            font: inherit;
        }

        input[type="text"],
        input[type="number"],
        textarea {
            width: 100%;
            min-height: 44px;
            flex: 1;
            padding: 11px 12px;
            border: 1px solid transparent;
            border-radius: 8px;
            background: var(--field);
            color: var(--field-text);
            transition: border-color 0.18s ease, box-shadow 0.18s ease;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(21, 208, 195, 0.18);
        }

        input[type="file"] {
            color: var(--muted);
            cursor: pointer;
            padding: 10px 0;
        }

        button,
        input[type="button"] {
            min-width: 78px;
            min-height: 44px;
            padding: 0 16px;
            border: 1px solid var(--line-strong);
            border-radius: 8px;
            background: rgba(18, 42, 50, 0.96);
            color: var(--text);
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease;
        }

        button:hover,
        input[type="button"]:hover,
        button:focus,
        input[type="button"]:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--accent);
            color: #053136;
        }

        button:active,
        input[type="button"]:active {
            transform: translateY(1px);
        }

        button:disabled,
        input[type="button"]:disabled {
            cursor: default;
            opacity: 0.68;
            transform: none;
        }

        .source-list,
        .history-list {
            display: grid;
            gap: 10px;
        }

        .source-row {
            display: grid;
            grid-template-columns: minmax(180px, 1.2fr) minmax(240px, 2fr) auto;
            gap: 12px;
            align-items: center;
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: rgba(8, 22, 28, 0.56);
        }

        .source-main {
            min-width: 0;
        }

        .source-name {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            min-width: 0;
            font-weight: 800;
        }

        .source-file,
        .source-url,
        .source-time {
            margin-top: 5px;
            color: var(--muted);
            font-size: 0.88rem;
            overflow-wrap: anywhere;
        }

        .source-url {
            margin-top: 0;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            min-height: 24px;
            padding: 0 8px;
            border-radius: 999px;
            border: 1px solid var(--line-strong);
            color: var(--muted);
            font-size: 0.78rem;
            font-weight: 800;
        }

        .pill.active {
            border-color: rgba(144, 230, 167, 0.72);
            color: var(--ok);
        }

        .pill.builtin {
            color: var(--accent-strong);
            border-color: rgba(95, 243, 223, 0.56);
        }

        .source-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        .danger:hover,
        .danger:focus {
            border-color: var(--danger);
            background: var(--danger);
            color: #2b0d06;
        }

        .empty {
            padding: 14px 0;
            color: var(--muted);
        }

        .history-row {
            margin-top: 10px;
        }

        .history-row input[type="text"] {
            color: var(--text);
            border-color: rgba(255, 255, 255, 0.1);
            background: rgba(74, 96, 104, 0.58);
        }

        .message-box {
            position: fixed;
            top: 22px;
            right: 22px;
            max-width: min(380px, calc(100vw - 44px));
            padding: 12px 18px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 8px;
            background: var(--surface);
            color: var(--text);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.28);
            opacity: 0;
            transform: translateX(24px);
            transition: opacity 0.24s ease, transform 0.24s ease;
            pointer-events: none;
            z-index: 10;
        }

        .message-box.show {
            opacity: 1;
            transform: translateX(0);
        }

        @media (max-width: 760px) {
            body {
                padding: 20px 14px 32px;
            }

            .brand-logo {
                width: 54px;
                height: 54px;
                border-radius: 14px;
            }

            .section-head,
            .field-row {
                flex-direction: column;
                align-items: stretch;
            }

            .source-row {
                grid-template-columns: 1fr;
            }

            .source-actions {
                justify-content: stretch;
            }

            button,
            input[type="button"] {
                width: 100%;
            }
        }
    </style>
</head>
<body>
<main class="page">
    <header class="brand">
        <img class="brand-logo" src="/logo.png" alt="Fish TV logo">
        <div>
            <h1 class="brand-title">Fish TV</h1>
            <p class="brand-subtitle">远程配置</p>
        </div>
    </header>

    <section class="section">
        <div class="section-head">
            <div>
                <h2>直播源清单</h2>
                <p class="hint">这里显示设备里已经缓存、可以在 App 内切换的直播源。</p>
            </div>
            <button type="button" id="refresh-sources">刷新</button>
        </div>
        <div id="source-list" class="source-list"></div>
    </section>

    <section class="section">
        <h2>导入直播源地址</h2>
        <p class="hint">填写 m3u、txt 等直播源地址，保存后会下载并加入上面的直播源清单。</p>
        <div class="field-row">
            <input type="text" id="uri" autocomplete="off" placeholder="https://example.com/iptv.m3u">
            <input type="button" id="confirm-uri" value="新增">
        </div>
        <div id="history-list" class="history-list"></div>
    </section>

    <section class="section">
        <h2>导入直播源文本</h2>
        <p class="hint">粘贴直播源文本并保存，会生成一个可管理的本地源。</p>
        <div class="field-row">
            <textarea id="plain-text" rows="5" placeholder="#EXTM3U"></textarea>
            <input type="button" id="confirm-plain-text" value="保存">
        </div>
    </section>

    <section class="section">
        <h2>上传直播源文件</h2>
        <p class="hint">选择文件后会自动上传，文件名会作为源名称显示在清单里。</p>
        <div class="field-row">
            <input type="file" id="upload-file" multiple>
        </div>
    </section>

    <section class="section">
        <label for="channel">默认播放频道号</label>
        <div class="field-row">
            <input type="number" id="channel" min="0" max="99" placeholder="0">
            <input type="button" id="confirm-channel" value="保存">
        </div>
        <p class="hint">从 1 开始，0 表示使用默认设置。</p>
    </section>

    <section class="section">
        <label for="epg">EPG 地址</label>
        <div class="field-row">
            <input type="text" id="epg" placeholder="https://example.com/epg.xml">
            <input type="button" id="confirm-epg" value="保存">
        </div>
    </section>

    <section class="section">
        <label for="proxy">代理地址</label>
        <div class="field-row">
            <input type="text" id="proxy" placeholder="http://0.0.0.0:0">
            <input type="button" id="confirm-proxy" value="保存">
        </div>
    </section>
</main>

<div id="messageBox" class="message-box"></div>

<script>
    const copy = {
        saved: '已保存',
        switched: '已切换',
        deleted: '已删除',
        uploaded: '已上传',
        empty: '内容不能为空',
        invalidUrl: '无效的地址：',
        loadFailed: '配置读取失败，请刷新后重试',
        confirmDelete: '确定删除这个缓存直播源吗？',
        noSources: '暂无直播源',
        current: '当前',
        builtin: '内置',
        cached: '已缓存',
        uncached: '未缓存',
        enable: '启用',
        remove: '删除',
        removeHistory: '从历史删除'
    };

    const sourceList = document.querySelector('#source-list');
    const historyList = document.querySelector('#history-list');
    const uploadFile = document.querySelector('#upload-file');

    const showMessage = (message, duration = 2600) => {
        const messageBox = document.getElementById('messageBox');
        messageBox.textContent = message;
        messageBox.classList.add('show');

        window.clearTimeout(showMessage.timer);
        showMessage.timer = window.setTimeout(() => {
            messageBox.classList.remove('show');
        }, duration);
    };

    const uuidV4 = () => {
        return ([1e7] + '-' + 1e3 + '-' + 4e3 + '-' + 8e3 + '-' + 1e11).replace(/[018]/g, c =>
            (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)
        );
    };

    const isValidUrl = (url) => {
        try {
            new URL(url);
            return true;
        } catch (e) {
            return false;
        }
    };

    const normalizeUrl = (value, fallbackScheme = 'http') => {
        let url = value.trim();
        if (!url) return '';
        if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(url)) {
            url = fallbackScheme + '://' + url;
        }
        return url;
    };

    const post = async (url, body) => {
        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain; charset=utf-8' },
            body
        });
        if (!response.ok) {
            throw new Error(await response.text());
        }
        const text = await response.text();
        try {
            return JSON.parse(text);
        } catch (e) {
            return text;
        }
    };

    const formatTime = (timestamp) => {
        if (!timestamp) return '无更新时间';
        return new Date(timestamp).toLocaleString();
    };

    const loadSourceList = async () => {
        const response = await fetch('/api/source-list');
        if (!response.ok) throw new Error(await response.text());
        const json = await response.json();
        renderSourceList(json.sources || []);
    };

    const renderSourceList = (sources) => {
        sourceList.innerHTML = '';
        if (!sources.length) {
            const empty = document.createElement('div');
            empty.className = 'empty';
            empty.textContent = copy.noSources;
            sourceList.append(empty);
            return;
        }

        sources.forEach(item => {
            const row = document.createElement('div');
            row.className = 'source-row';

            const main = document.createElement('div');
            main.className = 'source-main';

            const name = document.createElement('div');
            name.className = 'source-name';
            name.append(document.createTextNode(item.name || item.filename));

            if (item.active) {
                const active = document.createElement('span');
                active.className = 'pill active';
                active.textContent = copy.current;
                name.append(active);
            }

            if (item.builtIn) {
                const builtin = document.createElement('span');
                builtin.className = 'pill builtin';
                builtin.textContent = copy.builtin;
                name.append(builtin);
            }

            const cache = document.createElement('span');
            cache.className = 'pill';
            cache.textContent = item.cached ? copy.cached : copy.uncached;
            name.append(cache);

            const file = document.createElement('div');
            file.className = 'source-file';
            file.textContent = item.filename;

            const time = document.createElement('div');
            time.className = 'source-time';
            time.textContent = formatTime(item.cacheTime);

            main.append(name, file, time);

            const url = document.createElement('div');
            url.className = 'source-url';
            url.textContent = item.url || '本地内置源';

            const actions = document.createElement('div');
            actions.className = 'source-actions';

            const enable = document.createElement('button');
            enable.type = 'button';
            enable.textContent = item.active ? copy.current : copy.enable;
            enable.disabled = item.active;
            enable.onclick = async () => {
                enable.disabled = true;
                await post('/api/switch-source', JSON.stringify({ filename: item.filename }));
                await loadSourceList();
                showMessage(copy.switched);
            };
            actions.append(enable);

            const remove = document.createElement('button');
            remove.type = 'button';
            remove.className = 'danger';
            remove.textContent = copy.remove;
            remove.onclick = async () => {
                if (!window.confirm(copy.confirmDelete)) return;
                await post('/api/delete-source-cache', JSON.stringify({ filename: item.filename }));
                await loadSourceList();
                showMessage(copy.deleted);
            };
            actions.append(remove);

            row.append(main, url, actions);
            sourceList.append(row);
        });
    };

    const createHistoryRow = ({ uri, id }) => {
        const row = document.createElement('div');
        row.className = 'field-row history-row';

        const input = document.createElement('input');
        input.type = 'text';
        input.readOnly = true;
        input.value = uri;

        const button = document.createElement('input');
        button.type = 'button';
        button.value = copy.removeHistory;
        button.className = 'danger';
        button.onclick = async () => {
            await post('/api/remove-source', JSON.stringify({ sourceId: id }));
            row.remove();
            showMessage(copy.saved);
        };

        row.append(input, button);
        return row;
    };

    const loadSettings = async () => {
        const response = await fetch('/api/settings');
        if (!response.ok) throw new Error(await response.text());
        const json = await response.json();

        document.querySelector('#channel').value = json.channelDefault ?? 0;
        document.querySelector('#uri').value = json.channelUri ?? '';
        document.querySelector('#plain-text').value = json.channelText ?? '';
        document.querySelector('#epg').value = json.epg ?? '';
        document.querySelector('#proxy').value = json.proxy ?? '';

        historyList.innerHTML = '';
        const history = Array.isArray(json.history) ? json.history : [];
        history.forEach(item => {
            if (item && item.uri) {
                historyList.append(createHistoryRow({ uri: item.uri, id: item.id }));
            }
        });
    };

    uploadFile.onchange = async (e) => {
        const files = Array.from(e.target.files || []);
        for (const file of files) {
            const text = await file.text();
            await post('/api/import-text?name=' + encodeURIComponent(file.name), text);
        }
        if (files.length > 0) {
            await loadSourceList();
            showMessage(copy.uploaded);
        }
        uploadFile.value = '';
    };

    ['#uri', '#plain-text', '#channel', '#epg', '#proxy'].forEach(selector => {
        const element = document.querySelector(selector);
        element.addEventListener('focus', () => {
            element.scrollIntoView({ behavior: 'smooth', block: 'center' });
        });
    });

    document.querySelector('#refresh-sources').onclick = async () => {
        await loadSourceList();
        showMessage('已刷新');
    };

    document.querySelector('#confirm-uri').onclick = async () => {
        const uriInput = document.querySelector('#uri');
        const uri = normalizeUrl(uriInput.value);
        if (!uri || !isValidUrl(uri)) {
            alert(copy.invalidUrl + uri);
            return;
        }

        const uuid = uuidV4();
        uriInput.value = uri;
        await post('/api/import-uri', JSON.stringify({ id: uuid, uri }));
        showMessage('已提交下载，稍后刷新清单');
        window.setTimeout(async () => {
            await loadSettings();
            await loadSourceList();
        }, 1600);
    };

    document.querySelector('#confirm-plain-text').onclick = async () => {
        const content = document.querySelector('#plain-text').value.trim();
        if (!content) {
            alert(copy.empty);
            return;
        }
        await post('/api/import-text', content);
        await loadSourceList();
        showMessage(copy.saved);
    };

    document.querySelector('#confirm-channel').onclick = async () => {
        const channel = document.querySelector('#channel').value.trim();
        if (!channel) {
            alert(copy.empty);
            return;
        }
        await post('/api/default-channel', JSON.stringify({ channel: Number(channel) }));
        showMessage(copy.saved);
    };

    document.querySelector('#confirm-epg').onclick = async () => {
        const epg = document.querySelector('#epg').value.trim();
        await post('/api/epg', JSON.stringify({ epg }));
        showMessage(copy.saved);
    };

    document.querySelector('#confirm-proxy').onclick = async () => {
        const proxyInput = document.querySelector('#proxy');
        let proxy = proxyInput.value.trim();
        if (proxy && !/^(https?|socks[45]?):\/\//i.test(proxy)) {
            proxy = normalizeUrl(proxy);
        }
        if (proxy && !isValidUrl(proxy)) {
            alert(copy.invalidUrl + proxy);
            return;
        }
        proxyInput.value = proxy;
        await post('/api/proxy', JSON.stringify({ proxy }));
        showMessage(copy.saved);
    };

    (async () => {
        try {
            await Promise.all([loadSettings(), loadSourceList()]);
        } catch (e) {
            console.error(e);
            showMessage(copy.loadFailed, 5000);
        }
    })();
</script>
</body>
</html>
